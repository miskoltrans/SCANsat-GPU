// Measured 2026-09-15 at 0.1 degrees, rounded outward to 100 m, against each body's own PQS bounds.
// Not active: see the note at the top. A body is worth promoting when a finer survey stops moving
// its numbers, or when its PQS bounds are shown to be inherited rather than its own.
//
//   body        measured            PQS bounds        gap at the top
//   Earth       -10600 .. 6900      -10940 .. 8720     1861 m   summits missed; min is right
//   Mercury       1500 .. 12600      -2000 .. 24080   11486 m   huge - one of the two is very wrong
//   Miranda       -300 .. 13900      -8450 .. 16260    2439 m   min off by 8 km, worth a closer look
//   Vesta         1200 .. 54500       -310 .. 57120    2655 m   57 km of relief is real, not junk
//   Venus         1300 .. 11300      -1000 .. 12000     746 m
//   Io            1100 .. 18700          0 .. 20500    1852 m
//   Titan         -100 .. 1000         -50 .. 950         0 m   PQS bounds were already exact
//   Phobos           0 .. 6100         -20 .. 6190       171 m
//   Moon          -100 .. 19900       -400 .. 20310     431 m
//   Mars           200 .. 29700       -500 .. 29940     256 m
//   Deimos        -100 .. 2200         -20 .. 2200       49 m
//   Ceres          700 .. 14300       -410 .. 16220    1935 m
//   Europa           0 .. 8500           0 .. 9000      580 m
//   Ganymede       800 .. 21800      -1200 .. 25200    3404 m
//   Callisto      1000 .. 17600       -230 .. 20230    2644 m
//   Pluto         -100 .. 11000       -500 .. 11960    1031 m
//   Charon        -100 .. 10400       -200 .. 11660    1327 m
//
// Jupiter, Saturn, Uranus and Neptune are omitted entirely. They carry a PQS with no real surface,
// so the sweep measured them at -4602400, -5801000, -570800 and -413800 m, every extreme sitting on
// the first sample. SCANterrainSurvey now skips a body whose radiusMin equals its radiusMax, which
// is the same test generateTerrainConfig uses to fall back to the default range for them.
